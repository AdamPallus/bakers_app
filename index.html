<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f1e7" />
  <meta name="description" content="Baker’s percentage calculator with sourdough starter accounting and offline support." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="preload" href="/assets/fonts/fraunces.ttf" as="font" type="font/ttf" crossorigin />
  <script src="/install.js" defer></script>
  <script src="/calculator.js" defer></script>
  <title>Baker’s %</title>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <h1 class="brand">baker’s<span class="brand-percent">%</span></h1>
      <img class="bread-art" src="/assets/bread-engraving.jpg" width="800" height="533" alt="" fetchpriority="high" />
    </header>
    <main>
      <div class="workspace">
        <section class="formula" aria-labelledby="formula-title">
          <div class="section-heading"><h2 id="formula-title">Formula</h2></div>
          <div class="flour-field">
            <label for="flour">Total flour <span>including starter flour</span></label>
            <div class="input-wrap flour-input"><input id="flour" type="number" value="500" min="0" step="1" inputmode="decimal" /><span aria-hidden="true">g</span></div>
          </div>
          <div class="input-grid">
            <div class="field"><label for="hydration">Hydration</label><div class="input-wrap"><input id="hydration" type="number" value="70" min="0" step="0.1" inputmode="decimal" /><span aria-hidden="true">%</span></div></div>
            <div class="field"><label for="salt">Salt</label><div class="input-wrap"><input id="salt" type="number" value="2" min="0" step="0.1" inputmode="decimal" /><span aria-hidden="true">%</span></div></div>
            <div class="field"><label for="starter">Starter weight</label><div class="input-wrap"><input id="starter" type="number" value="100" min="0" step="1" inputmode="decimal" /><span aria-hidden="true">g</span></div></div>
            <div class="field"><label for="starterHydration">Starter hydration</label><div class="input-wrap"><input id="starterHydration" type="number" value="100" min="0" step="0.1" inputmode="decimal" /><span aria-hidden="true">%</span></div></div>
          </div>
        </section>

        <section class="recipe" aria-labelledby="recipe-title">
          <h2 id="recipe-title">To add</h2>
          <div class="ingredients" aria-live="polite" aria-atomic="true">
            <div class="ingredient"><span class="ingredient-label">Flour</span><b id="flourAdd">450 <small>g</small></b></div>
            <div class="ingredient"><span class="ingredient-label">Water</span><b id="waterAdd">300 <small>g</small></b></div>
            <div class="ingredient"><span class="ingredient-label">Salt</span><b id="saltAdd">10 <small>g</small></b></div>
          </div>
          <div class="starter-addition"><span>Starter</span><strong id="starterAdd">100 g</strong></div>
          <div class="total-row"><span>Total dough</span><b id="doughTotal">860 <small>g</small></b></div>
          <p class="warning" id="warning" role="status" hidden></p>
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-note"><span class="status-dot" aria-hidden="true"></span><span id="offline-status" role="status"></span></div>
      <div id="install-panel" class="install-panel"><button id="install" type="button">Install app <span aria-hidden="true">↗</span></button><p id="install-help" role="status" aria-live="polite" hidden></p></div>
    </footer>
  </div>
</body>
</html>
