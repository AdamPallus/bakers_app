<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baker's % Calculator</title>
  <style>
    :root { --bg:#0f1115; --card:#171a21; --text:#eef2ff; --muted:#9aa4b2; --accent:#7dd3fc; --ok:#86efac; --warn:#fca5a5; }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:760px;margin:24px auto;padding:16px}
    .card{background:var(--card);border:1px solid #2a3040;border-radius:16px;padding:18px}
    h1{margin:0 0 8px;font-size:1.4rem} p{color:var(--muted);margin:0 0 16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
    label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:6px}
    input{width:100%;padding:12px;border-radius:10px;border:1px solid #374151;background:#0b0e14;color:var(--text);font-size:1rem}
    .row{display:flex;gap:10px;align-items:center}
    .row input{flex:1}
    .btn{margin-top:14px;padding:12px 14px;border-radius:10px;border:1px solid #334155;background:#111827;color:var(--text);cursor:pointer}
    .results{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
    .result{background:#0b0f18;border:1px solid #27324a;border-radius:12px;padding:12px}
    .result b{display:block;font-size:1.2rem;color:var(--ok)}
    .small{font-size:.85rem;color:var(--muted)}
    .warn{margin-top:12px;color:var(--warn)}
    .footer{margin-top:8px;color:var(--muted);font-size:.85rem}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Baker's Percentage Calculator</h1>
      <p>Enter desired flour + percentages, then starter weight. Starter hydration defaults to 100% (1:1).</p>

      <div class="grid">
        <div>
          <label for="flour">Desired total flour (g)</label>
          <input id="flour" type="number" value="500" min="0" step="1" />
        </div>
        <div>
          <label for="hydration">Hydration (%)</label>
          <input id="hydration" type="number" value="70" min="0" step="0.1" />
        </div>
        <div>
          <label for="salt">Salt (%)</label>
          <input id="salt" type="number" value="2" min="0" step="0.1" />
        </div>
        <div>
          <label for="starter">Starter weight in dough (g)</label>
          <input id="starter" type="number" value="100" min="0" step="1" />
        </div>
        <div>
          <label for="starterHydration">Starter hydration (%)</label>
          <input id="starterHydration" type="number" value="100" min="0" step="0.1" />
        </div>
      </div>

      <button class="btn" id="calc">Calculate</button>

      <div class="results">
        <div class="result"><span class="small">Add flour</span><b id="flourAdd">—</b></div>
        <div class="result"><span class="small">Add water</span><b id="waterAdd">—</b></div>
        <div class="result"><span class="small">Add salt</span><b id="saltAdd">—</b></div>
        <div class="result"><span class="small">Total dough weight</span><b id="doughTotal">—</b></div>
      </div>

      <div class="footer" id="details"></div>
      <div class="warn" id="warning"></div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const round1 = n => Math.round(n * 10) / 10;
    const fmt = n => `${round1(n)} g`;

    function calculate() {
      const flourTotal = parseFloat($("flour").value) || 0;
      const hydration = (parseFloat($("hydration").value) || 0) / 100;
      const saltPct = (parseFloat($("salt").value) || 0) / 100;
      const starterWeight = parseFloat($("starter").value) || 0;
      const starterHydration = (parseFloat($("starterHydration").value) || 0) / 100;

      const starterFlour = starterWeight / (1 + starterHydration);
      const starterWater = starterWeight - starterFlour;

      const waterTotal = flourTotal * hydration;
      const saltTotal = flourTotal * saltPct;

      const flourAdd = flourTotal - starterFlour;
      const waterAdd = waterTotal - starterWater;
      const doughTotal = flourTotal + waterTotal + saltTotal;

      $("flourAdd").textContent = fmt(Math.max(0, flourAdd));
      $("waterAdd").textContent = fmt(Math.max(0, waterAdd));
      $("saltAdd").textContent = fmt(Math.max(0, saltTotal));
      $("doughTotal").textContent = fmt(Math.max(0, doughTotal));

      $("details").textContent = `Starter contributes ${fmt(starterFlour)} flour + ${fmt(starterWater)} water.`;

      const warnings = [];
      if (flourAdd < 0) warnings.push("Starter contributes more flour than target. Increase target flour or reduce starter.");
      if (waterAdd < 0) warnings.push("Starter contributes more water than target hydration allows.");
      $("warning").textContent = warnings.join(" ");
    }

    $("calc").addEventListener("click", calculate);
    ["flour","hydration","salt","starter","starterHydration"].forEach(id => $(id).addEventListener("input", calculate));
    calculate();
  </script>
</body>
</html>
